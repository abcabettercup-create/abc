<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell Out Distributor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface2:#f8fafa; --ink:#132227; --ink2:#46575d; --muted:#76868b;
  --line:#dfe5e7; --line2:#eef2f3; --accent:#1f3a5f; --accent-ink:#ffffff; --accent-soft:#e6ecf4;
  --good:#1a7f37; --good-soft:#e3f3e7; --bad:#b42318; --bad-soft:#fbe7e5; --warn:#9a6700; --warn-soft:#fdf2d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --k1:#4a3aa7; --k2:#e87ba4; --k3:#008300;
  --grid:#e9eef0; --shadow:0 1px 2px rgba(19,34,39,.06),0 4px 16px rgba(19,34,39,.04);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1416; --surface:#162023; --surface2:#1b262a; --ink:#edf3f4; --ink2:#b4c2c5; --muted:#869699;
    --line:#2a383c; --line2:#212d31; --accent:#a9c2e6; --accent-ink:#0e1416; --accent-soft:#233246;
    --good:#56c271; --good-soft:#193426; --bad:#ff7b6e; --bad-soft:#3a1f1c; --warn:#e2b340; --warn-soft:#3a3018;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --k1:#9085e9; --k2:#d55181; --k3:#008300;
    --grid:#233034; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1416; --surface:#162023; --surface2:#1b262a; --ink:#edf3f4; --ink2:#b4c2c5; --muted:#869699;
  --line:#2a383c; --line2:#212d31; --accent:#a9c2e6; --accent-ink:#0e1416; --accent-soft:#233246;
  --good:#56c271; --good-soft:#193426; --bad:#ff7b6e; --bad-soft:#3a1f1c; --warn:#e2b340; --warn-soft:#3a3018;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --k1:#9085e9; --k2:#d55181; --k3:#008300;
  --grid:#233034; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand .src{color:var(--ink2);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* filter bar */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:18px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi .s{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:700;padding:1px 7px;border-radius:999px;font-size:11.5px}
.delta.up{background:var(--good-soft);color:var(--good)}
.delta.down{background:var(--bad-soft);color:var(--bad)}
.delta.flat{background:var(--line2);color:var(--ink2)}

/* cards */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:360px}
.chartbox.short{height:220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line)}
.code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dname{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.dname i{width:9px;height:9px;border-radius:50%;flex:none}
.bar{position:relative;height:6px;background:var(--line2);border-radius:3px;min-width:60px}
.bar b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;min-width:0;width:260px;max-width:100%}
.pager{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer}
.pager button[disabled]{opacity:.4;cursor:default}

/* distributor scorecards */
.dcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dcard:hover{border-color:var(--ink2)}
.dcard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.dcard .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dcard .nm{font-weight:800;font-size:15px}
.dcard .per{font-size:11.5px;color:var(--muted)}
.dcard .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.dcard .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11.5px;color:var(--muted)}
.dcard .mini b{display:block;color:var(--ink);font-size:13px}
.dcard .pic{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px}
.dcard .pic.empty{color:var(--muted);font-style:italic}

/* PIC form */
.pic-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:38px}
.note{font-size:12px;color:var(--muted)}

/* insights */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.ins{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.ins .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ins .b{font-weight:700;font-size:15px}
.ins .d{font-size:12.5px;color:var(--ink2)}

.empty-state{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:50}
.dist-pick{display:flex;gap:8px;flex-wrap:wrap}
.foot{font-size:12px;color:var(--muted);line-height:1.6}
.foot b{color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

const nf0=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});

function deltaHtml(cur,prev,label){

/* ============ data pack / unpack ============ */
const PCOLS=['Distributor','Periode','Area','Sales','KodeCust','NamaCust','Segmen','Produk','Kategori'];
const SHORT=['d','p','a','s','kc','nc','sg','pr','kt'];
function unpack(pk){
  const out=[];const D=pk.dict;
  for(const r of pk.rows){const o={};
    for(let i=0;i<PCOLS.length;i++) o[SHORT[i]]=D[PCOLS[i]][r[i]];
    o.q=r[9];o.kg=r[10];o.o=r[11];out.push(o);}
  return out;}
function pack(rows){
  const dict={},idx={};PCOLS.forEach(c=>{dict[c]=[];idx[c]=new Map();});
  const out=[];
  for(const o of rows){const r=[];
    PCOLS.forEach((c,i)=>{const v=String(o[SHORT[i]]==null?'':o[SHORT[i]]);let k=idx[c].get(v);if(k===undefined){k=dict[c].length;dict[c].push(v);idx[c].set(v,k);}r.push(k);});
    r.push(+o.q||0,Math.round((+o.kg||0)*1000)/1000,Math.round((+o.o||0)*100)/100);out.push(r);}
  return {cols:PCOLS.concat(['Qty','Kg','Omset']),dict,rows:out};}

function setData(rows){
  S.rows=rows;
  S.dists=[...new Set(rows.map(r=>r.d))].sort();
  S.periods=[...new Set(rows.map(r=>r.p))].sort();
  if(S.dist!=='ALL'&&!S.dists.includes(S.dist)) S.dist='ALL';
  S.from=S.periods[0];S.to=S.periods[S.periods.length-1];
  buildFilters();render();
}

/* ============ filtering ============ */
function base(opt){opt=opt||{};
  return S.rows.filter(r=>r.p>=S.from&&r.p<=S.to&&(S.kat==='ALL'||r.kt===S.kat)&&(opt.allDist||S.dist==='ALL'||r.d===S.dist)&&(!opt.dist||r.d===opt.dist));}
function periodsIn(){return S.periods.filter(p=>p>=S.from&&p<=S.to);}

/* ============ metrics per period ============ */
function perPeriod(rows,metric,keyFn){
  // returns Map key -> Map period -> value
  const res=new Map();
  const g=group(rows,r=>keyFn(r));
  for(const [k,arr] of g){const m=new Map();const gp=group(arr,r=>r.p);
    for(const [p,a] of gp){m.set(p,metric==='o'?sum(a,r=>r.o):metric==='kg'?sum(a,r=>r.kg):uniqCount(a,custKey));}
    res.set(k,m);}
  return res;}

function simpleTable(rows,kf,label,tot,fmt,withCust){

/* ============ CUSTOMER ============ */
function renderCustomer(v){
  const rows=base();const om=sum(rows,r=>r.o);
  const lastOf={};for(const d of S.dists){const p=S.rows.filter(r=>r.d===d&&r.p<=S.to).map(r=>r.p).sort();lastOf[d]=p[p.length-1];}
  let list=[...group(rows,custKey)].map(([k,a])=>{const ps=[...new Set(a.map(r=>r.p))].sort();const lp=ps[ps.length-1];const d=a[0].d;
    const gap=monthsBetween(lp,lastOf[d]);
    return {d,kc:a[0].kc,nc:a[0].nc,ar:a[0].a,sg:a[0].sg,o:sum(a,r=>r.o),kg:sum(a,r=>r.kg),m:ps.length,lp,gap};});
  const q=S.cust.q.trim().toLowerCase();
  if(q) list=list.filter(c=>(c.nc+' '+c.kc+' '+c.ar+' '+c.d).toLowerCase().includes(q));
  const k=S.cust.sort,dir=S.cust.dir;
  list.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='string'?x.localeCompare(y):x-y)*dir;});
  const aktif=list.filter(c=>c.gap===0).length,warn=list.filter(c=>c.gap===1).length,off=list.filter(c=>c.gap>=2).length;
  const per=25,pages=Math.max(1,Math.ceil(list.length/per));S.cust.page=Math.min(S.cust.page,pages-1);
  const pg=list.slice(S.cust.page*per,S.cust.page*per+per);
  const cols=[['#',null],['Distributor','d'],['Customer','nc'],['Area/Depo','ar'],['Omset','o',1],['%',null,1],['Volume','kg',1],['Bulan aktif','m',1],['Terakhir beli','lp'],['Status','gap']];
  v.innerHTML=
  '<div class="kpis">'+
   kpi('Customer dalam filter',nf0.format(list.length),'Omset <b>'+rpShort(sum(list,c=>c.o))+'</b>','')+
   kpi('Aktif bulan terakhir',nf0.format(aktif),'Beli di bulan terakhir data distributornya','<span class="pill good">Aktif</span>')+
   kpi('Absen 1 bulan',nf0.format(warn),'Perlu di-follow up','<span class="pill warn">1 bulan</span>')+
   kpi('Absen ≥ 2 bulan',nf0.format(off),'Berisiko hilang','<span class="pill bad">≥ 2 bulan</span>')+
  '</div>'+
  '<div class="card"><div class="tools"><input class="search" id="custQ" type="search" placeholder="Cari nama, kode, area…" value="'+esc(S.cust.q)+'" aria-label="Cari customer">'+
   '<div class="pager"><button id="pgPrev" type="button"'+(S.cust.page?'':' disabled')+'>‹</button><span>Hal. '+(S.cust.page+1)+' / '+pages+' · '+nf0.format(list.length)+' customer</span><button id="pgNext" type="button"'+(S.cust.page<pages-1?'':' disabled')+'>›</button></div></div>'+
   '<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th class="'+(c[2]?'n ':'')+(c[1]?'sortable':'')+'" data-k="'+(c[1]||'')+'">'+c[0]+(c[1]===k?(dir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>'+
   pg.map((c,i)=>'<tr><td>'+(S.cust.page*per+i+1)+'</td><td><span class="dname"><i style="background:'+distVar(c.d)+'"></i>'+esc(titleCase(c.d))+'</span></td><td><b>'+esc(c.nc)+'</b> <span class="code">'+esc(c.kc)+'</span></td><td>'+esc(c.ar)+'</td><td class="n">'+rpShort(c.o)+'</td><td class="n">'+pct(c.o/om)+'</td><td class="n">'+kgf(c.kg)+'</td><td class="n">'+c.m+'</td><td>'+plabel(c.lp)+'</td><td>'+statusPill(c.gap)+'</td></tr>').join('')+
   (pg.length?'':'<tr><td colspan="10" class="empty-state">Tidak ada customer yang cocok.</td></tr>')+
   '</tbody></table></div></div>';
  const qi=$('#custQ');qi.oninput=()=>{S.cust.q=qi.value;S.cust.page=0;const pos=qi.selectionStart;render();const n=$('#custQ');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  $('#pgPrev').onclick=()=>{S.cust.page--;render();};$('#pgNext').onclick=()=>{S.cust.page++;render();};
  v.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{const kk=th.dataset.k;if(S.cust.sort===kk)S.cust.dir*=-1;else{S.cust.sort=kk;S.cust.dir=(kk==='o'||kk==='kg'||kk==='m')?-1:1;}render();});
}
function monthsBetween(a,b){if(!a||!b)return 0;const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return Math.max(0,(y2-y1)*12+(m2-m1));}
function statusPill(g){return g===0?'<span class="pill good">Aktif</span>':g===1?'<span class="pill warn">Absen 1 bln</span>':'<span class="pill bad">Absen '+g+' bln</span>';}

/* ============ render ============ */
function render(){
  killCharts();syncChips();
  const v=$('#view');
  if(!S.rows.length){v.innerHTML='<div class="card empty-state">Belum ada data. Upload file Excel sell out.</div>';return;}
  try{
    if(S.tab==='ringkasan')renderRingkasan(v);
    else if(S.tab==='distributor')renderDistributor(v);
    else if(S.tab==='produk')renderProduk(v);
    else if(S.tab==='customer')renderCustomer(v);
    else renderArea(v);
  }catch(e){console.error(e);v.innerHTML='<div class="card empty-state">Terjadi kesalahan saat menampilkan data: '+esc(e.message)+'</div>';}
  renderSrc();
}
function renderSrc(){
  const m=S.meta;

/* ============ upload / parse ============ */
$('#uploadBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(typeof XLSX==='undefined'){toast('Pembaca Excel belum termuat. Coba lagi sebentar.');return;}
  toast('Membaca '+f.name+'…',20000);
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:false});
    const res=parseWorkbook(wb);
    if(!res.rows.length){toast('Tidak ada data yang dikenali. Pastikan sheet bernama DATA, atau format sheet sama dengan file sell out distributor.',7000);return;}
    S.meta={fileName:f.name,uploadedAt:Date.now(),rowCount:res.rows.length};
    setData(res.rows);
    let msg=nf0.format(res.rows.length)+' baris dimuat dari '+res.sheets.join(', ')+'.';
    if(res.unknown.size) msg+=' Produk tidak dikenal: '+[...res.unknown].slice(0,3).join(', ')+(res.unknown.size>3?'…':'')+'.';
    if(S.db){try{await saveDataset(res.rows,S.meta);msg+=S.local?' Tersimpan di browser ini.':' Tersimpan untuk semua pengguna.';}catch(err){msg+=' Tidak tersimpan permanen ('+(err&&err.code==='not_granted'?'akses edit diperlukan':(err&&err.message||'gagal'))+').';}}
    else msg+=' Hanya tampil di layar ini (penyimpanan tidak tersedia).';
    toast(msg,8000);
  }catch(err){console.error(err);toast('Gagal membaca file: '+err.message,7000);}
};
function findHeader(aoa,need){for(let i=0;i<Math.min(aoa.length,30);i++){const r=(aoa[i]||[]).map(x=>String(x==null?'':x).trim());if(need.every(n=>r.includes(n))){const m={};r.forEach((h,j)=>{if(h&&m[h]===undefined)m[h]=j;});return {i,m};}}return null;}
function toPeriod(v){
  if(v instanceof Date&&!isNaN(v)){const t=new Date(v.getTime()+12*3600e3);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');}
  if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(Math.round(v*1e6)/1e6+1e-6);return d.y+'-'+String(d.m).padStart(2,'0');}
  const s=String(v||'').trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0');
  m=s.match(/^(\d{4})-(\d{2})/);if(m)return m[1]+'-'+m[2];return null;}
function parseWorkbook(wb){
  const rows=[],sheets=[],unknown=new Set();
  const push=(o)=>{const sp=stdProduct(o.raw);let pr=sp,kt,kgu,isi;
    if(sp){[kt,kgu,isi]=MASTER[sp];}else{pr=String(o.raw||'').toUpperCase().trim();kt='Lainnya';kgu=0;isi=1;unknown.add(o.raw);}
    let q=+o.q||0;if(o.karton)q*=isi;
    const kg=o.kg!=null&&o.kg!==''&&!isNaN(+o.kg)?+o.kg:q*kgu;
    if(!o.p||!(+o.o||q))return;
    rows.push({d:o.d,p:o.p,a:clean(o.a),s:clean(o.s).replace(/\s+/g,' '),kc:clean(o.kc)||('NOKODE-'+clean(o.nc).toUpperCase()),nc:clean(o.nc),sg:clean(o.sg),pr,kt:o.kt||kt,q,kg,o:+o.o||0});};
  const clean=v=>String(v==null?'':v).trim();
  // gabungan
  if(wb.Sheets['DATA']){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets['DATA'],{header:1,raw:true,defval:null});
    const h=findHeader(aoa,['Distributor','Periode','Produk Standar','Omset (Rp)']);
    if(h){const M=h.m;for(let i=h.i+1;i<aoa.length;i++){const r=aoa[i];if(!r||!r[M['Distributor']])continue;
      push({d:clean(r[M['Distributor']]),p:toPeriod(r[M['Periode']])||clean(r[M['Periode']]),a:r[M['Area/Depo']],s:r[M['Sales']],kc:r[M['Kode Customer']],nc:r[M['Nama Customer']],sg:r[M['Segmen Customer']],raw:r[M['Produk Standar']]||r[M['Nama Produk (Asli)']],q:r[M['Qty (Pcs/Zak)']],kg:r[M['Volume (Kg)']],o:r[M['Omset (Rp)']]});}
      sheets.push('DATA');return {rows,sheets,unknown};}
  }
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let h;
    if((h=findHeader(aoa,['Keterangan Barang','Values (Rp)']))){const M=h.m;const dname=name.replace(/^TOTAL\s+/i,'').trim().toUpperCase();
      for(let i=h.i+1;i<aoa.length;i++){const r=aoa[i];if(!r||!r[M['Keterangan Barang']])continue;
        const y=+r[M['Year']],mo=+r[M['Mo']];const s=clean(r[M['SALES']]);
        push({d:dname,p:(y&&mo)?y+'-'+String(mo).padStart(2,'0'):null,a:r[M['Area']],s:s.split('/')[0],kc:r[M['No. Pelanggan']],nc:r[M['Nama Pelanggan']],sg:s.includes('/')?s.split('/').pop().trim().toUpperCase():'',raw:r[M['Keterangan Barang']],q:r[M['Qty Pack']],o:r[M['Values (Rp)']]});}
      sheets.push(name);}
    else if((h=findHeader(aoa,['Nama Item','Netto']))){const M=h.m;const dname=/ARIES/i.test(name)?'ARIES CENTAURUS':name.trim().toUpperCase();
      for(let i=h.i+1;i<aoa.length;i++){const r=aoa[i];if(!r||!r[M['Nama Item']])continue;
        push({d:dname,p:toPeriod(r[M['Tanggal']]),a:r[M['DEPO']],s:r[M['Salesman']],kc:r[M['Kode Customer']],nc:r[M['Customer']],sg:[clean(r[M['Kel.Usaha']]),clean(r[M['Jenis Usaha']])].filter(Boolean).join(' - '),raw:r[M['Nama Item']],q:r[M['Qty']],karton:String(r[M['Satuan']]||'').toUpperCase()==='KARTON',o:r[M['Netto']]});}
      sheets.push(name);}
    else if((h=findHeader(aoa,['Distributor','Nama Produk','Omset']))){const M=h.m;
      for(let i=h.i+1;i<aoa.length;i++){const r=aoa[i];if(!r||!r[M['Nama Produk']])continue;
        const isi=M['Isi/Pack']!==undefined?r[M['Isi/Pack']]:null;
        push({d:clean(r[M['Distributor']]).toUpperCase(),p:toPeriod(r[M['Tanggal']]),a:r[M['Depo']],s:r[M['Sales']],kc:r[M['Kode Konsumen']],nc:r[M['Nama Konsumen']],sg:'',raw:r[M['Nama Produk']],q:isi!=null&&isi!==''?isi:r[M['Jumlah']],kg:M['Volume (Kg)']!==undefined?r[M['Volume (Kg)']]:null,o:r[M['Omset']]});}
      sheets.push(name);}
  }
  return {rows,sheets,unknown};
}

/* ============ persistence (db) ============ */
const CHUNK=150000;
async function saveDataset(rows,meta){
  const s=JSON.stringify(pack(rows));const ver='v'+Date.now();const n=Math.ceil(s.length/CHUNK);
  for(let i=0;i<n;i++) await S.db.doc('datasetChunks/'+ver+'_'+i).set({part:s.slice(i*CHUNK,(i+1)*CHUNK),i});
  const old=S.meta&&S.meta.version&&S.meta.chunks?{v:S.meta.version,n:S.meta.chunks}:null;
  const m=Object.assign({},meta,{version:ver,chunks:n});
  await S.db.doc('dataset/current').set(m);S.meta=m;S.loadedVersion=ver;
  if(old&&old.v!==ver){for(let i=0;i<old.n;i++){try{await S.db.doc('datasetChunks/'+old.v+'_'+i).delete();}catch(e){}}}
}
async function loadDataset(m){
  if(!m||!m.version||!m.chunks||m.version===S.loadedVersion)return;
  let s='';for(let i=0;i<m.chunks;i++){const snap=await S.db.doc('datasetChunks/'+m.version+'_'+i).get();const d=snap.data();if(!d)return;s+=d.part;}
  const rows=unpack(JSON.parse(s));S.meta=m;S.loadedVersion=m.version;setData(rows);
}

/* ============ tabs & boot ============ */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;try{localStorage.setItem('so_tab',S.tab);}catch(e){}render();});
try{const t=localStorage.getItem('so_tab');if(t)S.tab=t;}catch(e){}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{for(const k in charts)charts[k].resize();},150);});
const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* local fallback store (file dibuka langsung di browser) */
function localDb(){
  const K='so_db_';const subs={};
  const rd=k=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):undefined;}catch(e){return undefined;}};
  const keys=c=>{const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(K+c+'/')===0)out.push(k.slice(K.length));}}catch(e){}return out;};
  const snapDoc=k=>{const d=rd(k);return {id:k.split('/').pop(),exists:d!==undefined,data:()=>d};};
  const fire=k=>{const c=k.split('/')[0];(subs[k]||[]).forEach(f=>f(snapDoc(k)));(subs['@'+c]||[]).forEach(f=>f(snapCol(c)));};
  const snapCol=c=>{const docs=keys(c).map(snapDoc);return {docs,size:docs.length,empty:!docs.length};};
  return {
    doc(k){return {
      get:async()=>snapDoc(k),
      set:async d=>{try{localStorage.setItem(K+k,JSON.stringify(d));}catch(e){throw {code:'quota_exceeded',message:'penyimpanan browser penuh'};}fire(k);},
      delete:async()=>{try{localStorage.removeItem(K+k);}catch(e){}fire(k);},
      onSnapshot(f){(subs[k]=subs[k]||[]).push(f);setTimeout(()=>f(snapDoc(k)),0);return ()=>{};}};},
    collection(c){return {onSnapshot(f){(subs['@'+c]=subs['@'+c]||[]).push(f);setTimeout(()=>f(snapCol(c)),0);return ()=>{};}};}
  };
}
function attachDb(db){
      S.db=db;render();
      db.collection('pic').onSnapshot(snap=>{const p={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.distributor)p[x.distributor]=x;});S.pic=p;
        const act=document.activeElement;if(act&&act.closest&&act.closest('.pic-card'))return;render();},()=>{});
      db.doc('dataset/current').onSnapshot(snap=>{const m=snap.data();if(m)loadDataset(m).catch(e=>console.error(e));},()=>{});
}
function boot(){
  try{setData(unpack(JSON.parse(document.getElementById('seed').textContent)));}catch(e){console.error(e);render();}
  const hosted=!!(window.claude&&window.claude.use);
  if(hosted){window.claude.use('db').then(db=>{if(db)attachDb(db);else{S.local=true;attachDb(localDb());}}).catch(()=>{S.local=true;attachDb(localDb());});}
  else{S.local=true;attachDb(localDb());}
}
if(typeof Chart==='undefined'){window.addEventListener('load',boot);}else boot();
})();
